[workspace]
resolver = "2"
members = [
    "crates/ratus-core",
    "crates/ratus-eval",
    "crates/ratus-prober",
    "crates/ratus-storage",
    "crates/ratus-alert",
    "crates/ratus-server",
    "crates/ratus-benchmarks",
    "crates/ratus-compat-tests",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
authors = ["Tim Ehlers <ehlers320@users.noreply.github.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ehlerst/ratus"
readme = "README.md"

[workspace.dependencies]
# Internal workspace crates
ratus-core = { path = "crates/ratus-core" }
ratus-eval = { path = "crates/ratus-eval" }
ratus-prober = { path = "crates/ratus-prober" }
ratus-storage = { path = "crates/ratus-storage" }
ratus-alert = { path = "crates/ratus-alert" }
ratus-server = { path = "crates/ratus-server" }

# Async runtime & HTTP
tokio = { version = "1.43", features = ["full"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-full"] }
hyper = { version = "1.5", features = ["full"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli"] }

# Serialization & Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
regex = "1.11"
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2.5", features = ["serde"] }
base64 = "0.22"

# CLI & Observability
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"

# Concurrency & Data Structures
parking_lot = "0.12"
crossbeam-channel = "0.5"
crossbeam-queue = "0.3"
bytes = "1.10"
rusqlite = { version = "0.32", features = ["bundled"] }

# Benchmarking & Testing
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
wiremock = "0.6"
tempfile = "3.17"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = "thin"
